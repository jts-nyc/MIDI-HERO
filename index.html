<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI Hero</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1117;
        --panel: #1a1d27;
        --panel-2: #232735;
        --text: #e8eaf0;
        --muted: #9aa0b4;
        --accent: #4f8cff;
        --accent-2: #ff9f43;
        --good: #3ddc84;
        --bad: #ff5c5c;
        --border: #2f3446;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #overlay { position: fixed; inset: 0; pointer-events: none; }
      #overlay > * { pointer-events: auto; }
      .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; padding: 24px; background: rgba(15, 17, 23, 0.92); overflow: auto; }
      .screen.transparent { background: transparent; pointer-events: none; }
      .screen.transparent > * { pointer-events: auto; }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px;
        width: min(720px, 100%); max-height: 100%; overflow: auto; }
      h1 { font-size: 28px; margin: 0 0 4px; }
      h2 { font-size: 20px; margin: 0 0 12px; }
      p { margin: 6px 0; color: var(--muted); line-height: 1.4; }
      button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 8px; padding: 10px 16px; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      button.big { font-size: 20px; padding: 16px 32px; }
      button:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .list { display: flex; flex-direction: column; gap: 8px; }
      .item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px;
        border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); cursor: pointer; }
      .item:hover, .item.selected { border-color: var(--accent); }
      .item .meta { color: var(--muted); font-size: 13px; }
      table { border-collapse: collapse; width: 100%; font-size: 14px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
      tr.part { cursor: pointer; }
      tr.part.selected { background: rgba(79, 140, 255, 0.15); }
      tr.part.dim { color: var(--muted); }
      .badge { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 999px; background: var(--panel-2);
        border: 1px solid var(--border); margin-left: 6px; color: var(--muted); }
      .badge.warn { border-color: var(--accent-2); color: var(--accent-2); }
      label.field { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; }
      label.field select, label.field input[type=number], label.field input[type=range] { font: inherit; }
      .toast { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: var(--panel);
        border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; max-width: 80%; }
      .toast.error { border-color: var(--bad); }
      .hud-hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
      .hud-hint button { padding: 6px 12px; font-size: 13px; opacity: 0.8; }
      .link-import { margin-top: 8px; flex-wrap: nowrap; }
      .link-import input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--panel-2);
        border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
      .link-msg { min-height: 1.4em; font-size: 14px; }
      .dropzone { outline: 3px dashed var(--accent); outline-offset: -12px; }
      .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
      .seg button { display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 8px 6px; }
      .seg button span { font-size: 12px; font-weight: 400; opacity: 0.8; }
      .levels-note { font-size: 12px; margin: 4px 0 0; }
      .stars { font-size: 40px; letter-spacing: 6px; color: var(--accent-2); }
      .accuracy { font-size: 72px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
      .accuracy.landed { animation: land 0.35s ease-out; }
      .delta { color: var(--muted); font-size: 14px; margin-top: 4px; }
      .delta.up { color: var(--good); }
      .star { display: inline-block; opacity: 0.3; }
      .star.on { animation: star-in 0.4s cubic-bezier(0.2, 1.6, 0.4, 1) both; animation-delay: var(--d); }
      .results.still .star.on { animation: none; opacity: 1; }
      .streak-line b { color: var(--text); font-size: 18px; }
      .sections { display: grid; gap: 4px; max-width: 420px; margin: 10px auto; font-size: 13px; color: var(--muted); }
      .section { display: grid; grid-template-columns: 90px 1fr 40px; gap: 8px; align-items: center; text-align: left; }
      .section .bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
      .section .fill { height: 100%; width: var(--w); border-radius: 4px; background: var(--bad);
        animation: grow 0.6s ease-out both; animation-delay: calc(var(--i) * 80ms + 600ms); }
      .section .fill.ok { background: var(--accent-2); }
      .section .fill.good { background: var(--good); }
      .results.still .section .fill { animation: none; }
      .next { color: var(--text); font-size: 16px; }
      .cal-dots { display: flex; gap: 10px; justify-content: center; margin: 16px 0; }
      .cal-dots .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--border); }
      .cal-dots .dot.on { background: var(--good); border-color: var(--good); }
      .cal-stage { position: relative; height: 220px; margin: 12px auto; width: 120px; background: var(--panel-2); border-radius: 8px; overflow: hidden; }
      .cal-line { position: absolute; left: 0; right: 0; bottom: 10px; height: 3px; background: var(--accent); }
      .cal-ball { position: absolute; left: 50%; top: 0; width: 56px; height: 14px; border-radius: 4px; background: var(--muted); opacity: 0; }
      .cal-ball.scored { background: var(--accent-2); }
      @keyframes star-in { from { opacity: 0; transform: scale(2.4) rotate(-30deg); } to { opacity: 1; transform: none; } }
      @keyframes grow { from { width: 0; } to { width: var(--w); } }
      @keyframes land { from { transform: scale(1.25); } to { transform: none; } }
      .kbd { font-family: ui-monospace, Menlo, monospace; background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
      /* First-run setup and the keyboard check: big words, one thing to do per screen */
      .setup { text-align: center; }
      .setup h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.15; margin: 4px 0 12px; }
      .setup .say { font-size: 20px; color: var(--text); }
      .setup .got { font-size: clamp(24px, 4vw, 36px); font-weight: 700; min-height: 1.4em; margin: 8px 0; }
      .setup .got.ok { color: var(--good); }
      .setup .got.no { color: var(--accent-2); font-size: 22px; }
      .setup .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
      .setup .choices button { font-size: 22px; padding: 20px 12px; }
      .setup .choices button span { display: block; font-size: 14px; font-weight: 400; opacity: 0.85; margin-top: 4px; }
      .setup .waiting { animation: setup-pulse 1.4s ease-in-out infinite; }
      @keyframes setup-pulse { 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .setup .waiting { animation: none; } }
      button.link { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 6px; margin-top: 12px; }
      .mini-kb { position: relative; display: flex; height: 96px; width: min(520px, 100%); margin: 12px auto 4px; }
      .mini-kb .w { flex: 1; background: #e8eaf0; border: 1px solid #555; border-radius: 0 0 5px 5px; display: flex; align-items: flex-end; justify-content: center;
        color: #333; font-size: 12px; padding-bottom: 4px; }
      .mini-kb .w.target { background: var(--good); color: #062; font-weight: 700; }
      .mini-kb .b { position: absolute; top: 0; height: 58%; background: #15171f; border-radius: 0 0 3px 3px; }
      .mini-kb-arrow { font-size: 15px; color: var(--good); text-align: left; width: min(520px, 100%); margin: 0 auto; }
      /* Tutorial */
      .tut-kb { position: relative; display: flex; height: 110px; width: min(620px, 100%); margin: 16px auto 4px; }
      .tut-kb .w { flex: 1; background: #e8eaf0; border: 1px solid #555; border-radius: 0 0 5px 5px; display: flex; align-items: flex-end;
        justify-content: center; color: #555; font-size: 11px; padding-bottom: 4px; transition: background 0.1s; }
      .tut-kb .b { position: absolute; top: 0; height: 58%; background: #15171f; border-radius: 0 0 3px 3px; transition: background 0.1s; }
      .tut-kb .lit { background: var(--accent) !important; color: #fff; font-weight: 700; }
      .tut-demo { position: relative; width: 180px; height: 170px; margin: 12px auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
      .tut-demo .line { position: absolute; left: 0; right: 0; top: 118px; height: 3px; background: #54e4e8; }
      .tut-demo .fall { position: absolute; left: 70px; width: 40px; height: 30px; top: 0; border-radius: 4px; background: #ffd23f;
        animation: tut-fall 2.4s ease-in infinite; }
      .tut-demo .key { position: absolute; left: 66px; top: 124px; width: 48px; height: 44px; border-radius: 0 0 5px 5px; background: #e8eaf0;
        animation: tut-key 2.4s infinite; }
      @keyframes tut-fall { 0% { top: -10px; opacity: 1; } 55%, 75% { top: 88px; opacity: 1; } 76%, 100% { top: 88px; opacity: 0; } }
      @keyframes tut-key { 0%, 54% { background: #e8eaf0; } 55%, 75% { background: #54e4e8; } 76%, 100% { background: var(--good); } }
      @media (prefers-reduced-motion: reduce) { .tut-demo .fall { animation: none; top: 88px; } .tut-demo .key { animation: none; background: #54e4e8; } }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
