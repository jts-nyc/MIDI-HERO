<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI Hero</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1117;
        --panel: #1a1d27;
        --panel-2: #232735;
        --text: #e8eaf0;
        --muted: #9aa0b4;
        --accent: #4f8cff;
        --accent-2: #ff9f43;
        --good: #3ddc84;
        --bad: #ff5c5c;
        --border: #2f3446;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #overlay { position: fixed; inset: 0; pointer-events: none; }
      #overlay > * { pointer-events: auto; }
      .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; padding: 24px; background: rgba(15, 17, 23, 0.92); overflow: auto; }
      .screen.transparent { background: transparent; pointer-events: none; }
      .screen.transparent > * { pointer-events: auto; }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px;
        width: min(720px, 100%); max-height: 100%; overflow: auto; }
      h1 { font-size: 28px; margin: 0 0 4px; }
      h2 { font-size: 20px; margin: 0 0 12px; }
      p { margin: 6px 0; color: var(--muted); line-height: 1.4; }
      button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 8px; padding: 10px 16px; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      button.big { font-size: 20px; padding: 16px 32px; }
      button:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .list { display: flex; flex-direction: column; gap: 8px; }
      .item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px;
        border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); cursor: pointer; }
      .item:hover, .item.selected { border-color: var(--accent); }
      .item .meta { color: var(--muted); font-size: 13px; }
      table { border-collapse: collapse; width: 100%; font-size: 14px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
      tr.part { cursor: pointer; }
      tr.part.selected { background: rgba(79, 140, 255, 0.15); }
      tr.part.dim { color: var(--muted); }
      .badge { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 999px; background: var(--panel-2);
        border: 1px solid var(--border); margin-left: 6px; color: var(--muted); }
      .badge.warn { border-color: var(--accent-2); color: var(--accent-2); }
      label.field { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; }
      label.field select, label.field input[type=number], label.field input[type=range] { font: inherit; }
      .toast { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: var(--panel);
        border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; max-width: 80%; }
      .toast.error { border-color: var(--bad); }
      .hud-hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
      .hud-hint button { padding: 6px 12px; font-size: 13px; opacity: 0.8; }
      .dropzone { outline: 3px dashed var(--accent); outline-offset: -12px; }
      .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
      .seg button { display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 8px 6px; }
      .seg button span { font-size: 12px; font-weight: 400; opacity: 0.8; }
      .stars { font-size: 40px; letter-spacing: 6px; color: var(--accent-2); }
      .accuracy { font-size: 72px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
      .accuracy.landed { animation: land 0.35s ease-out; }
      .delta { color: var(--muted); font-size: 14px; margin-top: 4px; }
      .delta.up { color: var(--good); }
      .star { display: inline-block; opacity: 0.3; }
      .star.on { animation: star-in 0.4s cubic-bezier(0.2, 1.6, 0.4, 1) both; animation-delay: var(--d); }
      .results.still .star.on { animation: none; opacity: 1; }
      .streak-line b { color: var(--text); font-size: 18px; }
      .sections { display: grid; gap: 4px; max-width: 420px; margin: 10px auto; font-size: 13px; color: var(--muted); }
      .section { display: grid; grid-template-columns: 90px 1fr 40px; gap: 8px; align-items: center; text-align: left; }
      .section .bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
      .section .fill { height: 100%; width: var(--w); border-radius: 4px; background: var(--bad);
        animation: grow 0.6s ease-out both; animation-delay: calc(var(--i) * 80ms + 600ms); }
      .section .fill.ok { background: var(--accent-2); }
      .section .fill.good { background: var(--good); }
      .results.still .section .fill { animation: none; }
      .next { color: var(--text); font-size: 16px; }
      @keyframes star-in { from { opacity: 0; transform: scale(2.4) rotate(-30deg); } to { opacity: 1; transform: none; } }
      @keyframes grow { from { width: 0; } to { width: var(--w); } }
      @keyframes land { from { transform: scale(1.25); } to { transform: none; } }
      .kbd { font-family: ui-monospace, Menlo, monospace; background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
