<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="430" viewBox="0 0 1050 430" role="img" aria-labelledby="title desc">
<title id="title">A proposed feedback contract for MIDI-HERO</title><desc id="desc">Physical action produces immediate acknowledgment. Target judgment then produces musical and visual consequences. A useful player interpretation supports the next action. Omitted notes enter through deadline expiration rather than physical input.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#53706b"/></marker></defs>
<rect width="1050" height="430" rx="12" fill="#eff4eb"/>
<g font-family="system-ui, sans-serif" fill="#173b39">
<text x="30" y="35" font-size="14" letter-spacing="1.3">PROPOSED DESIGN MODEL · NOT ORIGINAL GUITAR HERO SOURCE CODE</text>
<g fill="white" stroke="#b5c9bd" stroke-width="1.5"><rect x="30" y="65" width="225" height="115" rx="9"/><rect x="305" y="65" width="225" height="115" rx="9"/><rect x="580" y="65" width="440" height="115" rx="9"/><rect x="30" y="240" width="225" height="110" rx="9"/><rect x="305" y="240" width="225" height="110" rx="9"/><rect x="580" y="240" width="440" height="110" rx="9"/></g>
<g font-size="21" font-weight="650"><text x="47" y="98">Physical action</text><text x="322" y="98">Target judgment</text><text x="597" y="98">Musical + visual consequence</text><text x="47" y="273">Next attempt</text><text x="322" y="273">Useful interpretation</text><text x="597" y="273">Different recovery clocks</text></g>
<g font-size="15"><text x="47" y="128">Press · hold · release</text><text x="47" y="153">Acknowledge the actual key.</text><text x="322" y="128">Pitch · onset · current goal</text><text x="322" y="153">Resolve each target once.</text><text x="597" y="128">Sound, hit response, score, phrase state</text><text x="597" y="153">Success must have a consistent meaning.</text><text x="47" y="303">Recover · retry · add a layer</text><text x="47" y="327">A reachable musical goal.</text><text x="322" y="303">What happened?</text><text x="322" y="327">What can I change?</text><text x="597" y="303">Next correct note → regained musical flow</text><text x="597" y="327">Phrase recovery → rebuilt scoring advantage</text></g>
<g fill="none" stroke="#53706b" stroke-width="2" marker-end="url(#arrow)"><path d="M255 122H300"/><path d="M530 122H575"/><path d="M800 180V235"/><path d="M580 296H535"/><path d="M305 296H260"/><path d="M140 240V185"/></g>
<text x="30" y="391" font-size="15">No input is also meaningful: an expired target enters judgment as an omission, not an extra press.</text>
</g></svg>
